<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FollowUp Mini | Lead Tracker</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17233c;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:30px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:27px}h2{font-size:18px;margin:0 0 14px}.muted{color:#68758b;font-size:14px}.brand{color:#355de5}.panel,.stat{background:white;border:1px solid #e2e8f2;border-radius:14px;padding:20px;box-shadow:0 2px 12px #15244708}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0}.stat strong{display:block;font-size:29px;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select,textarea{border:1px solid #d5ddea;border-radius:9px;padding:11px;font:inherit;background:white;color:#17233c;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid #aabaff}button{cursor:pointer;border:0;background:#355de5;color:white;border-radius:9px;padding:11px 15px;font-weight:600}button:hover{filter:brightness(.94)}button.secondary{background:#eaf0ff;color:#2c4bb4}button.danger{background:#fff0f0;color:#b42318}.toolbar input{flex:1;min-width:190px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:13px 9px;border-bottom:1px solid #edf0f6;font-size:14px}th{color:#68758b;font-weight:600}td button{padding:7px 10px;margin:2px;font-size:12px}.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#eef2ff;color:#3653a6;font-size:12px}.overdue{color:#b42318;font-weight:700}.today{color:#9a6100;font-weight:700}.empty{text-align:center;padding:28px;color:#68758b}dialog{border:0;border-radius:16px;padding:0;max-width:540px;width:calc(100% - 30px);box-shadow:0 20px 70px #12203b45}dialog::backdrop{background:#0c193b88}.modal{padding:25px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}.wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.notice{margin-top:15px;font-size:13px;color:#68758b}.toast{position:fixed;bottom:20px;right:20px;background:#17233c;color:white;padding:12px 18px;border-radius:10px;display:none}@media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.shell{padding:20px 12px}h1{font-size:23px}}
</style>
</head>
<body><main class="shell">
<header><div><h1><span class="brand">FollowUp</span> Mini</h1><div class="muted">Simple follow-ups. More conversations.</div></div><button id="addBtn">+ Add lead</button></header>
<section class="stats" aria-label="Lead overview"><div class="stat"><span class="muted">Total leads</span><strong id="total">0</strong></div><div class="stat"><span class="muted">Follow up today</span><strong id="today">0</strong></div><div class="stat"><span class="muted">Overdue</span><strong id="overdue">0</strong></div><div class="stat"><span class="muted">Interested</span><strong id="interested">0</strong></div></section>
<section class="panel"><h2>Your leads</h2><div class="toolbar"><input id="search" placeholder="Search company, contact or email" aria-label="Search leads"><select id="filter" aria-label="Filter status"><option value="">All statuses</option><option>New</option><option>Contacted</option><option>Interested</option><option>Waiting</option><option>Closed</option></select><button class="secondary" id="exportBtn">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Company</th><th>Contact</th><th>Email</th><th>Status</th><th>Priority</th><th>Follow-up</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div><p class="notice">Your records are stored in this browser only. Export a CSV backup regularly. No email is sent automatically.</p></section>
</main>
<dialog id="editor"><form id="leadForm" class="modal"><h2 id="modalTitle">Add lead</h2><div class="fields"><label class="field">Company *<input name="company" required maxlength="120"></label><label class="field">Contact *<input name="contact" required maxlength="120"></label><label class="field wide">Email<input name="email" type="email" maxlength="200"></label><label class="field">Status<select name="status"><option>New</option><option>Contacted</option><option>Interested</option><option>Waiting</option><option>Closed</option></select></label><label class="field">Priority<select name="priority"><option>Medium</option><option>High</option><option>Low</option></select></label><label class="field wide">Follow-up date<input name="followup" type="date"></label><label class="field wide">Notes<textarea name="notes" rows="3" maxlength="1000"></textarea></label></div><div class="actions"><button type="button" class="secondary" id="cancelBtn">Cancel</button><button type="submit">Save lead</button></div></form></dialog><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const KEY='followup-mini-v1';let leads=[];let editingId=null;
const $=id=>document.getElementById(id);
try{const stored=JSON.parse(localStorage.getItem(KEY)||'[]');leads=Array.isArray(stored)?stored:[]}catch{leads=[];alert('Saved data could not be read. Exported backups may help recover it.')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(leads))}catch{alert('Browser storage is unavailable or full. Export your data before leaving.')}}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function flash(message){$('toast').textContent=message;$('toast').style.display='block';clearTimeout(flash.timer);flash.timer=setTimeout(()=>$('toast').style.display='none',2400)}
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}
function render(){const today=localDate();$('total').textContent=leads.length;$('today').textContent=leads.filter(l=>l.followup===today&&l.status!=='Closed').length;$('overdue').textContent=leads.filter(l=>l.followup&&l.followup<today&&l.status!=='Closed').length;$('interested').textContent=leads.filter(l=>l.status==='Interested').length;
const query=$('search').value.trim().toLowerCase(),filter=$('filter').value;const filtered=leads.filter(l=>(!filter||l.status===filter)&&[l.company,l.contact,l.email].some(v=>String(v||'').toLowerCase().includes(query))).sort((a,b)=>(a.followup||'9999').localeCompare(b.followup||'9999'));
const tbody=$('rows');tbody.replaceChildren();if(!filtered.length){const tr=el('tr');const td=el('td','No leads found. Add your first lead to get started.','empty');td.colSpan=7;tr.append(td);tbody.append(tr);return}
for(const lead of filtered){const tr=el('tr');tr.append(el('td',lead.company),el('td',lead.contact),el('td',lead.email||'—'));const status=el('td');status.append(el('span',lead.status,'pill'));tr.append(status,el('td',lead.priority));const date=el('td',lead.followup||'Not set');if(lead.followup&&lead.status!=='Closed'){if(lead.followup<today)date.className='overdue';else if(lead.followup===today)date.className='today'}tr.append(date);const actions=el('td');for(const [label,fn,cls] of [['Edit',()=>openEditor(lead.id),'secondary'],['Copy email',()=>copyEmail(lead),'secondary'],['Delete',()=>removeLead(lead.id),'danger']]){const btn=el('button',label,cls);btn.type='button';btn.addEventListener('click',fn);actions.append(btn)}tr.append(actions);tbody.append(tr)}}
function openEditor(id=null){editingId=id;const lead=leads.find(l=>l.id===id);$('modalTitle').textContent=lead?'Edit lead':'Add lead';$('leadForm').reset();for(const field of ['company','contact','email','status','priority','followup','notes'])if(lead)$('leadForm').elements.namedItem(field).value=lead[field]||'';$('editor').showModal()}
$('leadForm').addEventListener('submit',event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget).entries());for(const field of ['company','contact','email','notes'])data[field]=data[field].trim();if(!data.company||!data.contact)return;const record={...data,id:editingId||((typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+'-'+Math.random())};if(editingId)leads=leads.map(l=>l.id===editingId?record:l);else leads.push(record);save();render();$('editor').close();flash(editingId?'Lead updated':'Lead added')});
function removeLead(id){if(!confirm('Delete this lead permanently?'))return;leads=leads.filter(l=>l.id!==id);save();render();flash('Lead deleted')}
async function copyEmail(lead){const message=`Subject: Following up — ${lead.company}\n\nHi ${lead.contact},\n\nI wanted to follow up on our previous conversation. Would you be available for a quick discussion this week?\n\nBest regards`;try{await navigator.clipboard.writeText(message);flash('Email draft copied')}catch{const box=document.createElement('textarea');box.value=message;document.body.append(box);box.select();const ok=document.execCommand('copy');box.remove();flash(ok?'Email draft copied':'Copy failed — use a secure browser context')}}
function csvEscape(value){const s=String(value??'');return /^[=+@\-\t\r]/.test(s)?'"\''+s.replaceAll('"','""')+'"':'"'+s.replaceAll('"','""')+'"'}
$('exportBtn').addEventListener('click',()=>{const fields=['company','contact','email','status','priority','followup','notes'];const csv=[fields.join(','),...leads.map(l=>fields.map(f=>csvEscape(l[f])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='followup-mini-backup.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);flash('CSV exported')});
$('addBtn').addEventListener('click',()=>openEditor());$('cancelBtn').addEventListener('click',()=>$('editor').close());$('search').addEventListener('input',render);$('filter').addEventListener('change',render);render();
</script></body></html>
